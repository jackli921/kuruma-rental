name = "kuruma-api"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Source maps (#959). Makes `wrangler deploy` upload Worker source maps to
# Cloudflare so the CF dashboard de-minifies traces. The Sentry side is separate:
# the `deploy` script's `--outdir dist` is what writes the local dist/worker.js.map
# that the gated `sentry:sourcemaps` CI step uploads, keyed to the SENTRY_RELEASE
# (commit SHA) the runtime reports — see package.json + deploy.yml.
upload_source_maps = true

# Daily 23:00 UTC = 08:00 JST. Fires the worker.ts `scheduled` handler, which runs
# two isolated jobs: the #916 §5.4 fleet-compliance digest and the #851
# refund-on-cancellation reconciler backstop.
[triggers]
crons = ["0 23 * * *"]

# CORS allowed origins for browser calls from the web Worker.
# The dev origins (localhost:3001, 127.0.0.1:3001) are always included in
# code (see packages/api/src/index.ts resolveAllowedOrigins); this var adds
# the deployed web origin. Without it, the deployed React Query calls from
# /manage/vehicles, /manage/customers, etc. fail with "Failed to fetch"
# because the browser rejects the response for missing Access-Control-Allow-Origin.
# Rate limiting: 100 requests per 60 seconds per IP.
# Uses Cloudflare's native rate limit binding (atomic, sub-ms, no KV needed).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
# Dotted keys instead of an inline table (`simple = { ... }`): Bun's TOML parser
# (used by knip's lint:deps under Bun) throws "Expected key but found [" on an
# inline table that is immediately followed by another [[array-of-tables]] header.
# This is valid TOML and a Bun bug; dotted keys are equivalent for wrangler and
# sidestep it. Don't collapse these back into an inline table.
simple.limit = 100
simple.period = 60

# Stricter rate limit for photo upload/delete, keyed per (userId, vehicleId).
# 5MB upload × global 100/60s per IP = 500MB/min R2 writes otherwise.
# 10/60s per user+vehicle caps realistic owner behavior (uploading ~10 photos
# for one vehicle) while blocking burst abuse.
[[ratelimits]]
name = "PHOTO_UPLOAD_LIMITER"
namespace_id = "1002"
simple.limit = 10
simple.period = 60

# Per-user aggregate cap across all vehicles. Stops keyspace-rotation bypass
# where a compromised staff token iterates vehicle IDs for fresh per-vehicle
# buckets (10/min × 50 vehicles = 500 uploads/min otherwise).
[[ratelimits]]
name = "PHOTO_UPLOAD_USER_LIMITER"
namespace_id = "1003"
simple.limit = 50
simple.period = 60

# Per-IP limiter for the public (unauthenticated) catalog endpoints:
# GET /vehicle-classes, /vehicle-classes/by-slug/:slug,
# /vehicle-classes/:slug/availability. Tighter than the global RATE_LIMITER
# because these are the only unauth data paths and are the most scrape-prone
# (competitor pricing crawls, availability enumeration).
[[ratelimits]]
name = "PUBLIC_CATALOG_LIMITER"
namespace_id = "1004"
simple.limit = 30
simple.period = 60

# Global app-side throttle for forward geocoding (#574). OSM/Nominatim's policy
# caps the WHOLE app at 1 req/s; the geocoder keys every lookup by one constant
# ("geocode:global") so this is a single shared bucket, not per-IP. period must be
# 10 or 60 (CF native limiter), so 1/10s is the tightest legal setting and stays
# safely under 1 req/s. Best-effort only — the CF limiter is per-colo (per edge
# region), not cross-region consistent, and a fixed window can admit 2 across a
# boundary; dev/local has no binding (unthrottled). The production provider's own
# server-side limit (e.g. LocationIQ) is the real guarantee.
[[ratelimits]]
name = "GEOCODE_LIMITER"
namespace_id = "1005"
simple.limit = 1
simple.period = 10

# Per-IP rate limit for the public operator application endpoint (#1277).
# Caps spam submissions at 5/60s per IP — realistic for legitimate applicants,
# too low to flood the inbox via automation.
[[ratelimits]]
name = "OPERATOR_APPLICATION_LIMITER"
namespace_id = "1006"
simple.limit = 5
simple.period = 60

# R2 buckets — R2 enabled on the account + buckets created 2026-06-14.
# VEHICLE_PHOTOS: public car photos, served via VEHICLE_PHOTOS_PUBLIC_URL (below).
# The composition root uses R2PhotoStorage only when BOTH the binding and that var
# are present; otherwise DisabledPhotoStorage throws on upload (repositories.ts:281).
# RENTER_DOCUMENTS: private renter ID docs, served through the Worker (no public URL).
[[r2_buckets]]
binding = "VEHICLE_PHOTOS"
bucket_name = "kuruma-vehicle-photos"

[[r2_buckets]]
binding = "RENTER_DOCUMENTS"
bucket_name = "kuruma-renter-documents"

# Geocode result cache (#601, #574 piece 1/2) — a durable, cross-isolate KV cache
# of `address -> {lat,lng}` so repeated lookups don't spend the 1-req/10s geocode
# budget (the OSMF policy asks consumers to cache). BLOCKED on #304: KV is not yet
# provisioned on this account, so the binding stays COMMENTED. Until it exists the
# composition root falls back to an in-process map (InMemoryGeocodeCache) — safe,
# just not shared across isolates. To activate post-#304:
#   1. npx wrangler kv namespace create GEOCODE_CACHE   (note the returned id)
#   2. uncomment the block below and set id = "<that id>"
#   3. redeploy — KvGeocodeCache picks it up via the globalThis.GEOCODE_CACHE
#      binding, no code change.
# [[kv_namespaces]]
# binding = "GEOCODE_CACHE"
# id = "<run: npx wrangler kv namespace create GEOCODE_CACHE>"

[vars]
# The live web origin. First entry feeds CORS AND the post-login redirect,
# Stripe return base, and provider-invite links (see resolveGoogleOAuthConfig
# / webBaseUrl in src/index.ts). Must be the deployed Pages origin, not a
# stale host, or those URLs send users to the wrong site.
WEB_ORIGIN = "https://kuruma-web-pages.pages.dev"

# Transactional email (Resend). EMAIL_FROM is the public "from" address (not a
# secret), so it lives here as a var. RESEND_API_KEY is a Worker secret set via
# rotate-secrets.yml. Must be on the Resend-verified sending domain.
EMAIL_FROM = "noreply@mail.jack-li.dev"

# Public base URL for vehicle photos (r2.dev public access on kuruma-vehicle-photos).
# Required non-empty or photo upload falls back to DisabledPhotoStorage
# (repositories.ts:281, r2-photo-storage.ts:38).
VEHICLE_PHOTOS_PUBLIC_URL = "https://pub-a6e9e98522e945a7aa1871f4fe741448.r2.dev"

# Monitoring (#361). The deployed version id is exposed as CF_VERSION_METADATA
# and used as the Sentry release tag so errors group per deploy.
# SENTRY_DSN is a SECRET, not a var: rotated via rotate-secrets.yml (+ the
# matching GitHub secret). Absent it, Sentry is gated off (no-op) — see
# src/observability/sentry-options.ts.
# SENTRY_ENVIRONMENT is non-secret and set here so activation can't forget it:
# this Worker serves the beta deploy, and unset would default to "production"
# (sentry-options.ts), mis-tagging beta errors. Change at real prod launch.
SENTRY_ENVIRONMENT = "beta"

[version_metadata]
binding = "CF_VERSION_METADATA"

# ---------------------------------------------------------------------------
# [env.production] — the real go-live API Worker (#1476 path-to-GA).
#
# Everything ABOVE this line is the default env = the `beta` deploy
# (`kuruma-api.kanata-studio.workers.dev`, Neon `beta` branch). This section
# defines a SECOND, isolated Worker for real customers, pointed at the clean
# `production-live` Neon branch (br-steep-rice-anpni2dm).
#
# Deploy with:  bun run --filter @kuruma/api deploy:production
#   ( = wrangler deploy --env production ... — see packages/api/package.json )
# It is INERT until someone runs that command with the prod secrets + CF
# resources in place. Nothing in CI targets it yet (deploy.yml is beta-only) —
# a guarded-but-dead prod job beside the live one is the exact "two truths in
# CI" footgun we removed in the #378 Pages cutover, so the prod deploy stays a
# deliberate manual command until the owner's CF resources (#1009) exist.
#
# NOTE: now that a named env exists, the beta deploy (`bun run deploy`, no
# `--env`) logs a harmless "Multiple environments are defined ... no target
# environment was specified" warning. Expected — a bare deploy targets this
# top-level config (= beta) exactly as before; the warning is informational.
#
# WRANGLER ENV INHERITANCE (why some keys are duplicated and some are not):
#   - INHERITABLE (taken from the top-level automatically, NOT repeated here):
#     main, compatibility_date, compatibility_flags, upload_source_maps.
#   - NON-INHERITABLE (MUST be re-declared per-env or they silently vanish):
#     vars, r2_buckets, ratelimits, version_metadata, kv_namespaces.
#   A dropped non-inheritable binding = a Worker that boots then 500s at
#   runtime (e.g. missing RATE_LIMITER), so every binding is re-declared below.
#   `triggers` is inheritable, but re-declared anyway so a prod deploy can't
#   silently skip the daily refund-reconciler / compliance-digest backstops.
#
# ISOLATION FROM BETA (owner decision 2026-07-11 — "fully isolated"):
#   - Separate R2 buckets (`*-production`) so real renter ID documents never
#     share storage with the beta test env.
#   - Distinct rate-limiter namespace ids (2001-2006 vs beta's 1001-1006) so
#     prod and beta don't share rate-limit counters.
# See docs/plans/2026-07-11-go-live-checklist.md for the owner steps that make
# this section deployable (create buckets, set secrets, prod Pages project).
# ---------------------------------------------------------------------------
[env.production]
name = "kuruma-api-production"

# Same daily 23:00 UTC (08:00 JST) cron as beta. Re-declared (not inherited)
# so prod is guaranteed to run worker.ts `scheduled`: the #916 fleet-compliance
# digest + the #851 refund-on-cancellation reconciler backstop.
[env.production.triggers]
crons = ["0 23 * * *"]

# Rate limiters — same limits/periods as beta, DISTINCT namespace ids (2001-2006)
# so prod counters are isolated from beta. See the beta blocks above for the
# rationale behind each limit; only the namespace_id changes here.
[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"
simple.limit = 100
simple.period = 60

[[env.production.ratelimits]]
name = "PHOTO_UPLOAD_LIMITER"
namespace_id = "2002"
simple.limit = 10
simple.period = 60

[[env.production.ratelimits]]
name = "PHOTO_UPLOAD_USER_LIMITER"
namespace_id = "2003"
simple.limit = 50
simple.period = 60

[[env.production.ratelimits]]
name = "PUBLIC_CATALOG_LIMITER"
namespace_id = "2004"
simple.limit = 30
simple.period = 60

[[env.production.ratelimits]]
name = "GEOCODE_LIMITER"
namespace_id = "2005"
simple.limit = 1
simple.period = 10

[[env.production.ratelimits]]
name = "OPERATOR_APPLICATION_LIMITER"
namespace_id = "2006"
simple.limit = 5
simple.period = 60

# R2 buckets — SEPARATE prod buckets. Owner must create both once (folds into
# #1009 CF provisioning):
#   npx wrangler r2 bucket create kuruma-vehicle-photos-production
#   npx wrangler r2 bucket create kuruma-renter-documents-production
#
# VEHICLE_PHOTOS is DELIBERATELY COMMENTED OUT (like the KV block below), NOT
# just left with an empty URL. A DECLARED VEHICLE_PHOTOS binding + empty
# VEHICLE_PHOTOS_PUBLIC_URL does NOT gracefully disable uploads — it THROWS at
# the composition root and 500s the entire API (assertPhotosBaseConfigured in
# composition/repositories.ts refuses to boot in that state, because an empty
# base also disables the #967 cross-tenant photo-spoof guard). With the binding
# absent, the composition root falls back to DisabledPhotoStorage: uploads are
# off, every other route works. To turn photos ON at go-live: create + enable
# r2.dev public access on the bucket, then UNCOMMENT this binding AND set
# VEHICLE_PHOTOS_PUBLIC_URL below IN THE SAME DEPLOY (both together, or it 500s).
# While commented, `wrangler deploy --env production` prints a harmless "binding
# VEHICLE_PHOTOS at top level but not on env.production" info note — that
# asymmetry is intentional; do NOT "fix" it by re-adding the binding alone.
# [[env.production.r2_buckets]]
# binding = "VEHICLE_PHOTOS"
# bucket_name = "kuruma-vehicle-photos-production"

[[env.production.r2_buckets]]
binding = "RENTER_DOCUMENTS"
bucket_name = "kuruma-renter-documents-production"

# Geocode cache KV — same as beta, still blocked on KV provisioning (#601/#304).
# Falls back to the in-process InMemoryGeocodeCache until provisioned. To
# activate: create a SEPARATE prod namespace and uncomment:
#   npx wrangler kv namespace create GEOCODE_CACHE --env production
# [[env.production.kv_namespaces]]
# binding = "GEOCODE_CACHE"
# id = "<run: npx wrangler kv namespace create GEOCODE_CACHE --env production>"

[env.production.vars]
# The live web origin for prod. Feeds CORS + post-login redirect + Stripe
# return base + provider-invite links (resolveGoogleOAuthConfig / webBaseUrl).
# Placeholder = the planned prod Pages project's default domain. TODO(go-live):
# replace with the real custom domain once procured, then redeploy.
WEB_ORIGIN = "https://kuruma-web-production.pages.dev"

# Same Resend-verified sending domain as beta (not a secret). RESEND_API_KEY is
# a Worker secret rotated via rotate-secrets.yml.
EMAIL_FROM = "noreply@mail.jack-li.dev"

# Public base URL for the PROD vehicle-photos bucket's r2.dev access. Kept
# PRESENT but EMPTY (not deleted) so it mirrors the top-level var and stays
# harmless while the VEHICLE_PHOTOS binding above is commented out (empty URL is
# only dangerous WITH a live binding — see that block). At go-live, uncomment
# that binding and set this to the prod bucket's real r2.dev URL in one deploy.
VEHICLE_PHOTOS_PUBLIC_URL = ""

# Sentry environment tag for prod (beta uses "beta"). Groups prod errors
# separately. SENTRY_DSN itself is a secret (rotate-secrets.yml).
SENTRY_ENVIRONMENT = "production"

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"
