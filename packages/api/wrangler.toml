name = "kuruma-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# CORS allowed origins for browser calls from the web Worker.
# The dev origins (localhost:3001, 127.0.0.1:3001) are always included in
# code (see packages/api/src/index.ts resolveAllowedOrigins); this var adds
# the deployed web origin. Without it, the deployed React Query calls from
# /manage/vehicles, /manage/customers, etc. fail with "Failed to fetch"
# because the browser rejects the response for missing Access-Control-Allow-Origin.
# Rate limiting: 100 requests per 60 seconds per IP.
# Uses Cloudflare's native rate limit binding (atomic, sub-ms, no KV needed).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# R2 bucket for vehicle photo uploads. Create the bucket manually:
#   npx wrangler r2 bucket create kuruma-vehicle-photos
# Enable public access for dev:
#   npx wrangler r2 bucket dev-url-enable kuruma-vehicle-photos
[[r2_buckets]]
binding = "VEHICLE_PHOTOS"
bucket_name = "kuruma-vehicle-photos"

[vars]
WEB_ORIGIN = "https://kuruma-rental.kanata-studio-dev.workers.dev"
