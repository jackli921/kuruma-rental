name = "kuruma-api"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# CORS allowed origins for browser calls from the web Worker.
# The dev origins (localhost:3001, 127.0.0.1:3001) are always included in
# code (see packages/api/src/index.ts resolveAllowedOrigins); this var adds
# the deployed web origin. Without it, the deployed React Query calls from
# /manage/vehicles, /manage/customers, etc. fail with "Failed to fetch"
# because the browser rejects the response for missing Access-Control-Allow-Origin.
# Rate limiting: 100 requests per 60 seconds per IP.
# Uses Cloudflare's native rate limit binding (atomic, sub-ms, no KV needed).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# Stricter rate limit for photo upload/delete, keyed per (userId, vehicleId).
# 5MB upload × global 100/60s per IP = 500MB/min R2 writes otherwise.
# 10/60s per user+vehicle caps realistic owner behavior (uploading ~10 photos
# for one vehicle) while blocking burst abuse.
[[ratelimits]]
name = "PHOTO_UPLOAD_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Per-user aggregate cap across all vehicles. Stops keyspace-rotation bypass
# where a compromised staff token iterates vehicle IDs for fresh per-vehicle
# buckets (10/min × 50 vehicles = 500 uploads/min otherwise).
[[ratelimits]]
name = "PHOTO_UPLOAD_USER_LIMITER"
namespace_id = "1003"
simple = { limit = 50, period = 60 }

# Per-IP limiter for the public (unauthenticated) catalog endpoints:
# GET /vehicle-classes, /vehicle-classes/by-slug/:slug,
# /vehicle-classes/:slug/availability. Tighter than the global RATE_LIMITER
# because these are the only unauth data paths and are the most scrape-prone
# (competitor pricing crawls, availability enumeration).
[[ratelimits]]
name = "PUBLIC_CATALOG_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# R2 bucket for vehicle photo uploads — DISABLED.
# R2 is not enabled on the current Cloudflare account (blocked on #304 account
# migration). Re-enable by uncommenting once R2 is provisioned:
#   npx wrangler r2 bucket create kuruma-vehicle-photos
#   npx wrangler r2 bucket dev-url-enable kuruma-vehicle-photos
# With the binding commented out, wrangler deploy no longer calls the R2 API
# (which was returning 10042 "Please enable R2"). Runtime: the composition
# root falls back to DisabledPhotoStorage, which returns a clear 500 on any
# upload attempt instead of silently accepting into ephemeral per-request memory.
# [[r2_buckets]]
# binding = "VEHICLE_PHOTOS"
# bucket_name = "kuruma-vehicle-photos"

[vars]
WEB_ORIGIN = "https://kuruma-rental.kanata-studio-dev.workers.dev"
