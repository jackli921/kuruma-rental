name: Rotate Worker Secrets

# Manually-triggered only. Re-asserts every production secret from
# GitHub Secrets onto both Workers, then does a fresh code deploy to
# promote the new secret values.
#
# Why this exists: the old deploy.yml used to re-assert secrets on
# every deploy to keep GitHub Secrets as the single source of truth
# (fix for the April 12 AUTH_SECRET drift incident). That pattern
# became incompatible with wrangler 4's gradual deployments, which
# refuse `wrangler secret put` when an un-promoted pending version
# exists (cloudflare/workers-sdk#6763). Removing the per-deploy
# re-assertion unblocked deploys; this workflow preserves the
# "GitHub Secrets = source of truth" story on a separate cadence.
#
# When to run:
#   - After changing a secret value in GitHub repo settings.
#   - If `Verify Worker secrets present` fails in a deploy.
#   - If you suspect secret drift between API and Web Workers
#     (AUTH_SECRET and DATABASE_URL MUST match across both).
#   - As a scheduled hygiene task (not automated here — run on demand).
#
# Pre-req: state must be clean (no pending un-promoted Worker version).
# A successful `deploy.yml` run leaves state clean; if this workflow
# errors on `wrangler secret put`, run deploy.yml first to flush.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Each `wrangler secret put` uploads a new pending Worker version
      # containing the updated secret. The following `wrangler deploy`
      # then uploads a fresh code version and promotes it, which clears
      # the pending state and makes the new secrets active.
      # IMPORTANT: AUTH_SECRET and DATABASE_URL must match between API
      # and Web workers. If you add a shared secret, add it to BOTH.
      # Google OAuth + AUTH_URL live on the API Worker since OAuth moved off the
      # web app (#378 Phase 2). AUTH_URL is the public Pages origin used to build
      # the google redirect_uri — set the GitHub Secret once Pages is live (#304).
      - name: Rotate API Worker secrets
        working-directory: packages/api
        run: |
          echo "${{ secrets.PROD_DATABASE_URL }}" | npx wrangler secret put DATABASE_URL
          echo "${{ secrets.AUTH_SECRET }}" | npx wrangler secret put AUTH_SECRET
          echo "${{ secrets.AUTH_GOOGLE_ID }}" | npx wrangler secret put AUTH_GOOGLE_ID
          echo "${{ secrets.AUTH_GOOGLE_SECRET }}" | npx wrangler secret put AUTH_GOOGLE_SECRET
          echo "${{ secrets.AUTH_URL }}" | npx wrangler secret put AUTH_URL
          # Transactional email (Resend). RESEND_API_KEY is a secret; the email
          # sender hard-throws in prod if absent (src/index.ts:154). EMAIL_FROM is
          # a non-secret var in wrangler.toml, deployed with code (not rotated).
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY
          # In-app Stripe payment (#461). Test-mode keys for the demo; both must be
          # set as GitHub Secrets first. The API gateway falls back to a throwing
          # sentinel when absent, so deploy.yml's presence check intentionally does
          # NOT require them yet — add them there once Stripe is live (HITL prereq).
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | npx wrangler secret put STRIPE_SECRET_KEY
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | npx wrangler secret put STRIPE_WEBHOOK_SECRET
          # Error monitoring (#361). SENTRY_DSN gates the API Worker's Sentry on;
          # absent/empty it stays a no-op (resolveSentryOptions). SENTRY_ENVIRONMENT
          # is a non-secret var in wrangler.toml ("beta"), not rotated here. Like
          # Stripe above, deploy.yml's presence check intentionally does NOT require
          # SENTRY_DSN yet — add it there once Sentry is live (HITL prereq).
          echo "${{ secrets.SENTRY_DSN }}" | npx wrangler secret put SENTRY_DSN
          # Consent ledger signing (#877/#1048). CONSENT_SIGNING_KEY is the HMAC
          # secret for consent acceptances (services/consent-signing.ts). Set it as a
          # GitHub Secret FIRST. Absent in production => resolveSigningKey() now THROWS
          # at request time (fail-closed, #1048) instead of silently writing
          # recordSignature: null; in non-prod it returns undefined to preserve the
          # IMPORTED-row contract. Set this before promoting consent Phase 2
          # (#1044/#1033) to a production deploy, or the accept endpoint 500s. Like
          # Stripe + Sentry above, deploy.yml's required-secret presence check
          # intentionally does NOT include it yet (would break deploys before the
          # secret exists); add CONSENT_SIGNING_KEY there once a prod deploy is gated on
          # it. CONSENT_SIGNING_KEY_ID is the rotation label bound into each signature
          # (defaults to 'v1' if unset); the keyId registry that keeps old rows
          # verifiable across a rotation is deferred to #1050. See
          # docs/runbooks/2026-06-24-consent-signing-key.md.
          echo "${{ secrets.CONSENT_SIGNING_KEY }}" | npx wrangler secret put CONSENT_SIGNING_KEY
          echo "${{ secrets.CONSENT_SIGNING_KEY_ID }}" | npx wrangler secret put CONSENT_SIGNING_KEY_ID
          # `bun run deploy` (not bare `npx wrangler deploy`) so a rotation ships the
          # same SENTRY_RELEASE (commit SHA) + --outdir as deploy.yml — otherwise the
          # promoted version would fall back to CF_VERSION_METADATA.id while Sentry
          # maps stay SHA-keyed, breaking symbolication for the live version (#959).
          bun run deploy

      # Upload the API source maps to Sentry for the version this rotation just
      # promoted (#959) — same gated, non-fatal step as deploy.yml. Separate step,
      # so it carries its own working-directory (steps don't inherit it).
      - name: Upload API source maps to Sentry
        working-directory: packages/api
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_API: ${{ vars.SENTRY_PROJECT_API }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT_API" ]; then
            echo "Sentry creds absent — skipping API source-map upload"; exit 0
          fi
          SENTRY_RELEASE="$(git rev-parse HEAD)" bun run sentry:sourcemaps \
            || echo "::warning::API source-map upload to Sentry failed (non-fatal)"

      # No web rotation step. The web app is moving to CF Pages (#378 §7.5),
      # which serves a static SPA and holds NO rotatable app secrets — auth +
      # DB live on the API Worker (rotated above). The proxy Functions' only
      # config is API_ORIGIN, a non-sensitive URL set once at #304 via
      # `wrangler pages secret put` (plan §8), not rotated here. The old frozen
      # web-Worker rotate steps were deleted with the deploy.yml block so this
      # tree has one active path (see plan §5). Restore from git history only if
      # the cutover is reverted.
