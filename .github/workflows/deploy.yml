name: Deploy

# Runs after CI passes on beta, OR manually via the Actions tab (workflow_dispatch).
# (beta = the live pre-contract environment: kuruma-web-pages.pages.dev + kuruma-api.
# Production deploy from `main` is a separate, not-yet-wired pipeline.)
# Deploys both Workers in a single pipeline with migrations applied first,
# so schema changes always land before the code that depends on them.
# This solves issue #27 ("apply pending migrations on deploy") and replaces
# the old CF dashboard Git integration that only deployed the web Worker.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_WORKER_URL: https://kuruma-api.kanata-studio.workers.dev
  WEB_PAGES_URL: https://kuruma-web-pages.pages.dev

jobs:
  deploy:
    # Skip if triggered by a failed CI run. workflow_dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # 1. Migrate production DB BEFORE deploying new code.
      # If this fails, the whole deploy aborts — stale schema is safer
      # than new code on a pre-migration DB (see: the bug that started
      # this session).
      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          bun run db:migrate
          bun run db:verify

      # 2. Deploy API Worker. First-time run creates the Worker.
      # Secrets are NOT re-asserted on every deploy: wrangler 4's gradual
      # deployments refuse `secret put` when there's an un-promoted pending
      # version (cloudflare/workers-sdk#6763), and the old re-assert-every-
      # deploy pattern accumulated those pending versions until deploys
      # locked up. Rotate secrets via rotate-secrets.yml (workflow_dispatch);
      # the presence check in step 3 fails the deploy loudly if one is gone.
      - name: Deploy API Worker
        working-directory: packages/api
        # `bun run deploy` is the SINGLE source of the deploy command (package.json):
        # `wrangler deploy --outdir dist --var SENTRY_RELEASE:$(git rev-parse HEAD)`.
        # CI, rotate-secrets.yml, and manual `bun run deploy` all go through it, so
        # the release var + source-map outdir can't drift between them (#959).
        run: bun run deploy

      # 2b. Upload the API Worker source maps to Sentry (#959) so stack frames
      # resolve to src/ not bundled worker.js. Gated as a shell no-op: GitHub
      # Actions forbids secrets in `if:`, so we map the creds to env and skip
      # cleanly when any is absent (mirrors the web's no-op-without-creds gate).
      # Release is keyed to the SAME `git rev-parse HEAD` the deploy used, so the
      # uploaded maps match the runtime release Sentry reports. Non-fatal: the API
      # is already deployed by here, so a Sentry flake must not strand the deploy.
      - name: Upload API source maps to Sentry
        working-directory: packages/api
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_API: ${{ vars.SENTRY_PROJECT_API }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT_API" ]; then
            echo "Sentry creds absent — skipping API source-map upload"; exit 0
          fi
          SENTRY_RELEASE="$(git rev-parse HEAD)" bun run sentry:sourcemaps \
            || echo "::warning::API source-map upload to Sentry failed (non-fatal)"

      # 3. Verify required secrets exist on the API Worker. Read-only drift
      # detector — catches "secret got deleted or never rotated" but NOT
      # value mismatches (CF never returns secret values). Source-of-truth
      # is GitHub Secrets, enforced by rotate-secrets.yml.
      # AUTH_GOOGLE_ID/SECRET + AUTH_URL moved here when OAuth moved onto the API
      # (#378 Phase 2). AUTH_URL is the public Pages origin used to build the
      # google redirect_uri; set it once Pages is live (#304). Missing any of
      # these ships /auth/google/* as a silent 503 — see resolveGoogleOAuthConfig.
      - name: Verify API Worker secrets present
        working-directory: packages/api
        run: |
          secrets_json=$(npx wrangler secret list)
          for key in DATABASE_URL AUTH_SECRET AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET AUTH_URL; do
            echo "$secrets_json" | jq -e --arg k "$key" 'any(.[]; .name == $k)' > /dev/null \
              || { echo "::error::Missing required secret on API Worker: $key (rotate via rotate-secrets.yml)"; exit 1; }
          done
          echo "API Worker secrets present"

      # 4. Smoke test the API before we point web traffic at it.
      # /health must return 200 and /bookings must not 500 (catches
      # the exact schema-drift class of bug that issue #27 tracks).
      # Retry with backoff: on first-time Worker deploys, the workers.dev
      # subdomain can take several seconds to become routable even after
      # `wrangler deploy` exits successfully. `--retry-all-errors` makes
      # curl retry on HTTP errors (404 during propagation), not just
      # network-level errors.
      - name: Smoke test API
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$API_WORKER_URL/health"
          echo "API smoke test passed"

      # 5. Build the Vite SPA → packages/web/dist (#378 §7.5 cutover). The old
      # opennext web-Worker deploy block was deleted here, not gated off: a dead
      # `if:false` deploy beside the live one is a footgun (someone un-freezes the
      # wrong path under pressure). The frozen Worker keeps serving production on
      # CF until the DNS flip (spec §8 step 6); git history is the recovery path.
      #
      # No VITE_API_BASE_URL is set on purpose — the client falls back to the
      # same-origin `/api` proxy (spec §5.5), which keeps the session cookie
      # SameSite=Lax. The placeholders mirror the CI "Build web" step; the static
      # build bakes no secret (no VITE_* references them), they only satisfy any
      # import-time env reads.
      - name: Build web (Vite → packages/web/dist)
        working-directory: packages/web
        env:
          AUTH_SECRET: ci-placeholder-secret-not-real
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          # Sentry web monitoring (#361). Secrets absent by default → web Sentry
          # stays gated off (resolveBrowserSentryOptions) and no source maps are
          # emitted (vite.config sentrySourcemapPlugin) until the DSN/token are
          # provisioned (HITL). VITE_SENTRY_RELEASE (the commit SHA) is always
          # baked in — harmless, public, and only read once a DSN enables the SDK.
          # VITE_SENTRY_DSN is a public
          # ingestion key (ships in the bundle by design); SENTRY_AUTH_TOKEN is a
          # real secret used only to UPLOAD maps — never a VITE_* var.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT || 'beta' }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: bun run build

      # 6. Enforce the gzip budget on the artifact we're about to ship, even if
      # CI was bypassed (workflow_dispatch). Cheap insurance against a bloated
      # deploy. Budget + math live in scripts/lint-dist-size.ts.
      - name: Check web dist size budget
        run: bun run lint:dist-size

      # 7. Deploy the SPA to CF Pages via the `deploy:pages` script (single
      # source of truth for the flags — also what a human runs for the first
      # post-#304 deploy). `functions/` is compiled from cwd (packages/web).
      #
      # The Pages project's compat flags (incl. global_fetch_strictly_public) and
      # API_ORIGIN var are NOT set here — `wrangler pages deploy` has no --config
      # and only auto-discovers a file named wrangler.jsonc (which here is the
      # frozen Worker config; it's warned-and-ignored). Those project settings are
      # applied once at #304 via `pages:create-project` + `wrangler pages secret
      # put API_ORIGIN` (see plan §3 / §8).
      #
      # GUARDED: WEB_PAGES_DEPLOY_ENABLED is an unset-by-default repo variable.
      # Until #304 lands (freelance CF account + the global_fetch_strictly_public
      # Pages flag) a manual workflow_dispatch must NOT create a stray Pages
      # project on the old account — so deploy + smoke stay dormant. Set the
      # variable to 'true' at cutover (docs/plans/2026-06-09-378-pages-cutover.md §8).
      - name: Deploy web to CF Pages
        if: vars.WEB_PAGES_DEPLOY_ENABLED == 'true'
        working-directory: packages/web
        run: bun run deploy:pages

      # 8. Smoke test the Pages deploy. Two curls because they prove different
      # things, and there is no Pages-side secret-presence step (unlike the API
      # Worker) to catch a missing API_ORIGIN:
      #   - /en exercises the static SPA shell (_redirects → index.html).
      #   - /api/health crosses the proxy Function → API_ORIGIN/health. A 200
      #     proves API_ORIGIN is set AND the upstream API is reachable; a 500
      #     ("API_ORIGIN is not configured") or a 5xx fails the deploy loudly,
      #     instead of shipping a green deploy whose /api calls 500 at runtime.
      # Same retry rationale as the API smoke test (first-deploy propagation).
      - name: Smoke test web (Pages)
        if: vars.WEB_PAGES_DEPLOY_ENABLED == 'true'
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$WEB_PAGES_URL/en" > /dev/null
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$WEB_PAGES_URL/api/health" > /dev/null
          echo "Web (Pages) shell + proxy seam OK"
