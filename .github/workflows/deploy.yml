name: Deploy

# Runs after CI passes on main, OR manually via the Actions tab (workflow_dispatch).
# Deploys both Workers in a single pipeline with migrations applied first,
# so schema changes always land before the code that depends on them.
# This solves issue #27 ("apply pending migrations on deploy") and replaces
# the old CF dashboard Git integration that only deployed the web Worker.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_WORKER_URL: https://kuruma-api.kanata-studio-dev.workers.dev
  WEB_WORKER_URL: https://kuruma-rental.kanata-studio-dev.workers.dev

jobs:
  deploy:
    # Skip if triggered by a failed CI run. workflow_dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # 1. Migrate production DB BEFORE deploying new code.
      # If this fails, the whole deploy aborts — stale schema is safer
      # than new code on a pre-migration DB (see: the bug that started
      # this session).
      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          bun run db:migrate
          bun run db:verify

      # 2. Deploy API Worker. First-time run creates the Worker.
      # Secrets are NOT re-asserted on every deploy: wrangler 4's gradual
      # deployments refuse `secret put` when there's an un-promoted pending
      # version (cloudflare/workers-sdk#6763), and the old re-assert-every-
      # deploy pattern accumulated those pending versions until deploys
      # locked up. Rotate secrets via rotate-secrets.yml (workflow_dispatch);
      # the presence check in step 3 fails the deploy loudly if one is gone.
      - name: Deploy API Worker
        working-directory: packages/api
        run: npx wrangler deploy

      # 3. Verify required secrets exist on the API Worker. Read-only drift
      # detector — catches "secret got deleted or never rotated" but NOT
      # value mismatches (CF never returns secret values). Source-of-truth
      # is GitHub Secrets, enforced by rotate-secrets.yml.
      # AUTH_GOOGLE_ID/SECRET + AUTH_URL moved here when OAuth moved onto the API
      # (#378 Phase 2). AUTH_URL is the public Pages origin used to build the
      # google redirect_uri; set it once Pages is live (#304). Missing any of
      # these ships /auth/google/* as a silent 503 — see resolveGoogleOAuthConfig.
      - name: Verify API Worker secrets present
        working-directory: packages/api
        run: |
          secrets_json=$(npx wrangler secret list)
          for key in DATABASE_URL AUTH_SECRET AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET AUTH_URL; do
            echo "$secrets_json" | jq -e --arg k "$key" 'any(.[]; .name == $k)' > /dev/null \
              || { echo "::error::Missing required secret on API Worker: $key (rotate via rotate-secrets.yml)"; exit 1; }
          done
          echo "API Worker secrets present"

      # 4. Smoke test the API before we point web traffic at it.
      # /health must return 200 and /bookings must not 500 (catches
      # the exact schema-drift class of bug that issue #27 tracks).
      # Retry with backoff: on first-time Worker deploys, the workers.dev
      # subdomain can take several seconds to become routable even after
      # `wrangler deploy` exits successfully. `--retry-all-errors` makes
      # curl retry on HTTP errors (404 during propagation), not just
      # network-level errors.
      - name: Smoke test API
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$API_WORKER_URL/health"
          echo "API smoke test passed"

      # 5. Build web. NEXT_PUBLIC_API_URL must be set at build time --
      # Next.js bakes NEXT_PUBLIC_* into the JS bundle, it is NOT
      # resolved at runtime. This is why the current production is
      # broken: web was built without this set and fell back to
      # http://localhost:8787.
      # BRIDGE FREEZE (#378 §7.4/§7.5): web is migrating to CF Pages. The old
      # Next.js Worker stays frozen at its last green build, so every web-Worker
      # step below is gated off (kept, not deleted, for removal at DNS cutover).
      # `build` is now `vite build` — running this path would build/deploy the
      # wrong artifact. The CF Pages deploy lands in a later PR (gated on #304).
      - name: Build Web Worker
        if: false
        working-directory: packages/web
        # NEXT_PUBLIC_API_URL must be a literal here, not `${{ env.X }}`.
        # GitHub Actions does not reliably propagate workflow-level env
        # into a step's `env:` block -- the reference resolves to an
        # empty string, and Next.js then bakes the fallback
        # `http://localhost:8787` into the server bundle. Symptom of the
        # bug this comment exists to prevent: deployed pages that fetch
        # from the API throw `Failed to fetch bookings: HTTP 404` because
        # they hit the web Worker's own URL instead of the API Worker.
        env:
          NEXT_PUBLIC_API_URL: https://kuruma-api.kanata-studio-dev.workers.dev
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          bun run build
          bun run build:worker

      - name: Deploy Web Worker
        if: false # bridge freeze (#378 §7.5) — delete at cutover
        working-directory: packages/web
        run: npx wrangler deploy

      # 7. Verify required secrets exist on the Web Worker. Same read-only
      # drift detector as the API step — see that step's comment for why.
      - name: Verify Web Worker secrets present
        if: false # bridge freeze (#378 §7.5) — delete at cutover
        working-directory: packages/web
        run: |
          secrets_json=$(npx wrangler secret list)
          for key in DATABASE_URL AUTH_SECRET AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET; do
            echo "$secrets_json" | jq -e --arg k "$key" 'any(.[]; .name == $k)' > /dev/null \
              || { echo "::error::Missing required secret on Web Worker: $key (rotate via rotate-secrets.yml)"; exit 1; }
          done
          echo "Web Worker secrets present"

      # 8. Smoke test the web landing page (public, no auth required).
      # Same retry rationale as the API smoke test.
      - name: Smoke test Web
        if: false # bridge freeze (#378 §7.5) — delete at cutover
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$WEB_WORKER_URL/en" > /dev/null
          echo "Web landing OK"
