name: CI

on:
  push:
    branches: [main, marketplace-pivot]
  pull_request:
    branches: [main, marketplace-pivot]

env:
  BUN_VERSION: "1.2.13"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run --filter '*' typecheck

      - name: Check import boundaries
        run: bun run --filter @kuruma/api lint:boundaries

      - name: Check shared export drift
        run: bun run scripts/lint-export-drift.ts

      - name: Check Next App Router tree stays removed
        run: bun run lint:no-next-app

      - name: Check FK indexes
        run: bun run lint:fk-indexes

      - name: Check i18n locale parity
        run: bun run lint:i18n-parity

      - name: Check web API clients validate unwrap() responses
        run: bun run lint:unwrap-schema

      - name: Check global fetch is bound on runtime surfaces
        run: bun run lint:fetch-binding

      - name: Check unused deps and exports
        run: bun run lint:deps
        continue-on-error: true

      - name: Test (all packages)
        run: bun run test

      - name: Build web
        run: bun run --filter @kuruma/web build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-real
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # The web CI build is now `vite build` (no `.next`), so slice 8's
      # `.next`-manifest renter-bundle advisory is obsolete — its perf concern is
      # "resolved by #378" per that slice. This enforcing gate is its successor.
      - name: Check web dist size budget
        run: bun run lint:dist-size

  # Non-bypassable drift gate. See scripts/db-verify.ts and the "Database
  # Migrations" section of CLAUDE.md for why this exists. Two production
  # incidents (see issue #27) traced to schema changes that shipped without
  # matching migrations. Running every PR against a fresh Postgres proves
  # migrations apply cleanly from scratch AND catches schema drift.
  db-drift:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kuruma
          POSTGRES_PASSWORD: kuruma
          POSTGRES_DB: kuruma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuruma -d kuruma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kuruma:kuruma@localhost:5432/kuruma_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Apply all migrations against fresh Postgres
        # Proves every committed migration applies cleanly from scratch.
        # Broken SQL, missing extensions, or ordering issues fail here.
        run: bun run db:migrate

      - name: Verify no schema drift
        # Proves schema.ts matches the latest snapshot (no pending migrations),
        # journal entries match on-disk .sql files, and DB migration count
        # matches the journal. See scripts/db-verify.ts.
        run: bun run db:verify

      - name: Run repository integration tests against fresh Postgres
        # Exercises all Drizzle repos against real tables (bookings,
        # vehicles, availability, messages, pricing). All integration
        # test files use postgres-js (TCP) via pg-test-client.ts.
        run: bun run --filter @kuruma/api test:integration

      - name: Prove db:verify fails when the double-booking guard is dropped
        # Regression guard for #702 (Check 5): db:verify MUST exit non-zero when a
        # critical custom DB object is missing. Runs LAST in this job — it drops a
        # constraint on the ephemeral CI database, so no later step may depend on
        # the schema. Uses postgres-js (a guaranteed dep), not psql.
        run: |
          bun -e 'import postgres from "postgres"; const sql = postgres(process.env.DATABASE_URL, { max: 1 }); await sql.unsafe("ALTER TABLE bookings DROP CONSTRAINT bookings_no_overlap"); await sql.end();'
          if bun run db:verify; then
            echo "::error::db:verify passed with bookings_no_overlap dropped — Check 5 (critical DB objects) is broken"
            exit 1
          fi
          echo "OK: db:verify correctly failed when the double-booking guard was dropped"

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          # Placeholder values — landing page has no API dependency today.
          # Update when adding auth/booking flows.
          AUTH_SECRET: ci-placeholder-secret-not-real
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-real-db:
    # Authenticated real-DB e2e gate (#445): runs the REAL Hono API + Vite web
    # against a fresh, seeded postgres:16 — no Neon branch, no external secrets.
    # The harness (#488) mints the API's kuruma_session cookie and drives the
    # marketplace happy path (search -> book -> confirmation -> operator portal).
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kuruma
          POSTGRES_PASSWORD: kuruma
          POSTGRES_DB: kuruma_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuruma -d kuruma_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kuruma:kuruma@localhost:5432/kuruma_e2e
      # Static, non-secret signing key: the harness mints the session cookie and
      # the API verifies it with the SAME value — both read this env. No GitHub
      # Secret needed; the DB is disposable and never leaves the runner.
      AUTH_SECRET: ci-real-db-e2e-static-secret-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Apply all migrations against fresh Postgres
        run: bun run db:migrate

      - name: Verify no schema drift
        run: bun run db:verify

      - name: Seed the marketplace fixture over TCP
        # db:seed:tcp uses postgres-js (TCP); the production neon-http getDb()
        # cannot reach a plain postgres:16 container.
        env:
          # Grant the walkthrough admin persona PLATFORM_ADMIN so it can reach the
          # env-gated /admin/revenue tab (#462). Mirror of ADMIN_SEED_EMAIL in
          # e2e/real-db/constants.ts — yaml can't import TS; keep them in sync.
          PLATFORM_ADMIN_EMAILS: platform-admin@kuruma.test
        run: bun run db:seed:tcp

      - name: Run authenticated real-DB E2E
        run: bun run test:e2e:real-db

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real-db
          path: playwright-report/
          retention-days: 7
